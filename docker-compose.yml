services:
  postgres:
    image: postgres:16-alpine
    container_name: chainpay-db
    environment:
      POSTGRES_USER: chainpay
      POSTGRES_PASSWORD: chainpay
      POSTGRES_DB: chainpay
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chainpay"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
