name: Deploy Backend to VPS

on:
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'services/blockchain-watcher/**'
      - 'packages/payment-core/**'
      - 'packages/typescript-config/**'
      - 'docker-compose.prod.yml'
      - 'Caddyfile'
      - '.github/workflows/deploy-backend.yml'

jobs:
  validate:
    name: Type-check backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm turbo run check-types --filter=api --filter=blockchain-watcher --filter=@repo/payment-core

  build-and-push:
    name: Build & Push Docker Images
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      # Build & Push Express API
      - name: Build and Push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:latest
            ghcr.io/${{ github.repository }}/api:${{ github.sha }}

      # Build & Push Watcher
      - name: Build and Push Watcher
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/blockchain-watcher/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/watcher:latest
            ghcr.io/${{ github.repository }}/watcher:${{ github.sha }}

  deploy:
    name: SSH Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /app/chainpay
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export API_IMAGE=ghcr.io/${{ github.repository }}/api:latest
            export WATCHER_IMAGE=ghcr.io/${{ github.repository }}/watcher:latest
            docker compose --env-file .env.production -f docker-compose.prod.yml pull api watcher
            docker compose --env-file .env.production -f docker-compose.prod.yml up -d --no-deps api watcher
