version: '3.8'

# Requires env vars from .env.production — always run via:
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d
# or: ./scripts/deploy-prod.sh up -d

services:
  # 1. Database
  postgres:
    image: postgres:16-alpine
    container_name: chainpay-db-prod
    environment:
      POSTGRES_USER: chainpay
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: chainpay
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chainpay -d chainpay"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: always

  # 2. Redis Queue Cache for Inngest
  redis:
    image: redis:alpine
    container_name: chainpay-redis-prod
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  # 3. Self-Hosted Inngest Server
  inngest:
    image: inngest/inngest:latest
    container_name: chainpay-inngest-prod
    command: >
      inngest start --host 0.0.0.0 --port 8288 
      --postgres-uri postgresql://chainpay:${DB_PASSWORD}@postgres:5432/chainpay?sslmode=disable 
      --redis-uri redis://redis:6379/0
    environment:
      - INNGEST_EVENT_KEY=${INNGEST_EVENT_KEY}
      - INNGEST_SIGNING_KEY=${INNGEST_SIGNING_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  # 4. Express API
  api:
    image: ${API_IMAGE:-chainpay-api-prod}
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    container_name: chainpay-api-prod
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgres://chainpay:${DB_PASSWORD}@postgres:5432/chainpay
      - INNGEST_BASE_URL=http://inngest:8288
      - INNGEST_EVENT_KEY=${INNGEST_EVENT_KEY}
      - INNGEST_SIGNING_KEY=${INNGEST_SIGNING_KEY}
    # Auto-run drizzle migrations on container boot
    command: sh -c "pnpm --filter api db:push && pnpm --filter api run start"
    depends_on:
      postgres:
        condition: service_healthy
      inngest:
        condition: service_started
    restart: always

  # 5. Blockchain Watcher
  watcher:
    image: ${WATCHER_IMAGE:-chainpay-watcher-prod}
    build:
      context: .
      dockerfile: ./services/blockchain-watcher/Dockerfile
    container_name: chainpay-watcher-prod
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://chainpay:${DB_PASSWORD}@postgres:5432/chainpay
      - RPC_SEPOLIA=${RPC_SEPOLIA_URL}
      - RPC_ETHEREUM=${RPC_ETHEREUM_URL}
      - RPC_BASE=${RPC_BASE_URL}
      - RPC_POLYGON=${RPC_POLYGON_URL}
      - RPC_ARBITRUM=${RPC_ARBITRUM_URL}
      - WATCHER_POLL_INTERVAL_MS=${WATCHER_POLL_INTERVAL_MS:-30000}
      - INNGEST_BASE_URL=http://inngest:8288
      - INNGEST_EVENT_KEY=${INNGEST_EVENT_KEY}
      - INNGEST_SIGNING_KEY=${INNGEST_SIGNING_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      inngest:
        condition: service_started
    restart: always

  # 6. Caddy Reverse Proxy
  caddy:
    image: caddy:2-alpine
    container_name: chainpay-proxy-prod
    environment:
      - API_DOMAIN=${API_DOMAIN}
      - INNGEST_DOMAIN=${INNGEST_DOMAIN}
      - INNGUEST_DASHBOARD_PASSWORD_HASH=${INNGUEST_DASHBOARD_PASSWORD_HASH}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - inngest
    restart: always

volumes:
  postgres_prod_data:
  caddy_data:
  caddy_config:
